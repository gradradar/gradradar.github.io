name: Refresh jobs

on:
  schedule:
    # 06:15 UTC daily - new postings are usually up by the start of the UK day.
    - cron: '15 6 * * *'
  workflow_dispatch:        # lets you trigger a run by hand from the Actions tab
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'fetcher/**'
      - 'config/**'
      - '.github/workflows/refresh.yml'

permissions:
  contents: write           # to commit the refreshed snapshot
  pages: write              # to publish the site
  id-token: write

concurrency:
  group: grad-radar
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch and rebuild the job snapshot
        env:
          # Optional. Without them the employer ATS boards still work.
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
        run: python3 -m fetcher.main

      - name: Commit the snapshot if it changed
        if: github.event_name != 'push'
        run: |
          git config user.name  'grad-radar-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/jobs.json
          if git diff --staged --quiet; then
            echo 'No change in the job list.'
            exit 0
          fi
          git commit -m "chore: refresh jobs ($(date -u '+%Y-%m-%d'))"
          # Someone may have pushed while this run was fetching, which takes
          # several minutes. Rebase onto whatever landed and try again.
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected, rebasing onto origin/main (attempt $attempt)"
            git fetch origin main
            # The snapshot is generated output: ours always wins a conflict.
            git rebase origin/main -X ours || {
              git checkout --ours site/data/jobs.json
              git add site/data/jobs.json
              git rebase --continue || git rebase --abort
            }
          done
          echo "::warning::could not push the refreshed snapshot after 3 attempts"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
